# Replace santa.example.com before installing. Certbot adds HTTPS afterwards.
server {
    listen 80;
    listen [::]:80;
    server_name santa.example.com;

    # Private participant URLs contain access tokens; do not log them.
    access_log off;
    error_log /var/log/nginx/secretsanta-error.log warn;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }
}
