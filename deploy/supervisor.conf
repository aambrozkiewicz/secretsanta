[program:secretsanta]
directory=/var/www/secretsanta
command=/usr/bin/node /var/www/secretsanta/node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3000
user=secretsanta
environment=NODE_ENV="production",HOME="/var/lib/secretsanta",PATH="/usr/bin:/bin",NEXT_TELEMETRY_DISABLED="1"
numprocs=1
autostart=true
autorestart=true
startsecs=10
startretries=3
stopsignal=TERM
stopwaitsecs=120
stopasgroup=true
killasgroup=true
umask=0077
redirect_stderr=true
stdout_logfile=/var/log/secretsanta/app.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
